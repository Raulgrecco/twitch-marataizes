<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fala Sem Medo — TV Marataízes</title>
<meta name="description" content="Um relato registrado pela população de Marataízes, com resposta oficial quando houver.">
<style>
  :root{--bg:#000;--fg:#fff;--card:#0e0e0e;--accent:#FF6F00;--max:1320px;}
  *{box-sizing:border-box;}
  html,body{margin:0;background:#050302;color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100%;}
  .wrap{max-width:680px;margin:0 auto;padding:40px 16px 60px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;text-decoration:none;color:#fff;font-weight:800;font-size:14px;}
  .brand span{color:var(--accent);}
  .aa-card{background:linear-gradient(160deg, #161010, #0e0b0a);border:1px solid #2a2020;border-radius:14px;padding:22px;margin-bottom:20px;}
  .aa-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .aa-card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .aa-card-cat{font-size:10.5px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;background:rgba(255,111,0,.1);padding:3px 9px;border-radius:5px;}
  .aa-card-bairro{font-size:11px;color:#999;background:#1c1616;padding:3px 9px;border-radius:5px;}
  .aa-card-data{font-size:11px;color:#777;}
  .aa-card-titulo{font-size:22px;font-weight:900;color:#fff;margin:6px 0 6px;line-height:1.3;}
  .aa-card-autor{display:block;font-size:12.5px;color:#999;margin-bottom:14px;}
  .aa-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;margin-bottom:14px;}
  .aa-badge.wait{background:rgba(230,126,0,.14);color:#e67e00;}
  .aa-badge.done{background:rgba(0,122,61,.16);color:#3ecf7e;}
  .aa-card-texto{font-size:15px;color:#ddd;line-height:1.7;margin:0 0 18px;white-space:pre-wrap;}
  .aa-card-foto{display:block;max-width:100%;border-radius:10px;margin-bottom:18px;border:1px solid #2a2020;}
  .aa-card-video{position:relative;width:100%;padding-top:56.25%;margin-bottom:18px;border-radius:10px;overflow:hidden;background:#000;}
  .aa-card-video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
  .aa-resposta{background:#12181a;border-left:3px solid #3ecf7e;border-radius:8px;padding:14px 16px;margin-bottom:18px;font-size:13.5px;color:#dde;}
  .aa-resposta .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#3ecf7e;font-weight:800;margin-bottom:6px;}
  .aa-resposta-convite{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#181410;border:1px dashed #3a2f22;border-radius:8px;padding:12px 16px;margin-bottom:16px;flex-wrap:wrap;}
  .aa-resposta-convite-txt{font-size:12.5px;color:#c9a876;}
  .aa-resposta-form{background:#141010;border:1px solid #2a2020;border-radius:8px;padding:14px;margin-bottom:18px;display:none;}
  .aa-resposta-form input, .aa-resposta-form textarea{width:100%;background:#0e0b0a;border:1px solid #2a2020;color:#fff;border-radius:6px;padding:9px 11px;font-size:13px;font-family:inherit;margin-bottom:10px;box-sizing:border-box;}
  .aa-resposta-form textarea{min-height:80px;resize:vertical;}
  .aa-resp-enviar{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;}
  .aa-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .aa-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:11px 16px;border-radius:8px;cursor:pointer;border:1px solid #2a2020;background:#181212;color:#eee;text-decoration:none;}
  .aa-btn:hover{border-color:var(--accent);color:var(--accent);}
  .aa-btn.primary{background:var(--accent);border:none;color:#fff;}
  .aa-fallback{text-align:center;padding:60px 20px;color:#888;}
  .aa-fallback a{color:var(--accent);text-decoration:none;font-weight:700;}
  .aa-loading{text-align:center;color:#888;padding:60px 20px;}
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="/">📢 TV Marataízes <span>· Fala Sem Medo</span></a>
  <div id="conteudo" class="aa-loading">Carregando relato…</div>
</div>

<script>
  const AA_ENDPOINT = "https://script.google.com/macros/s/AKfycbw4OdtJyoB0LFsD9ZVBhCZuGZa6hL1cYdoo2QizfUZ7k1k_IwE9KKuFCODgDSoVAL2Qkw/exec";
  const AA_SITE_BASE = "https://tvmarataizes.digital";

  function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

  function AA_prepararFoto(file, maxLado, qualidade){
    return new Promise((resolve)=>{
      if (!file) { resolve(null); return; }
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          let { width, height } = img;
          if (width > height && width > maxLado){ height = height*(maxLado/width); width = maxLado; }
          else if (height > maxLado){ width = width*(maxLado/height); height = maxLado; }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', qualidade || 0.75));
        };
        img.onerror = ()=> resolve(null);
        img.src = e.target.result;
      };
      reader.onerror = ()=> resolve(null);
      reader.readAsDataURL(file);
    });
  }
  function fmtData(iso){ try{ return new Date(iso).toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' }); }catch(e){ return ''; } }

  const conteudo = document.getElementById('conteudo');
  const path = window.location.pathname;

  // Link direto de divulgação — redireciona pra home já com o formulário aberto.
  if (/^\/falasemmedo\/?$/.test(path)) {
    window.location.replace('/?abrir=formulario#aa-section');
  } else {

  const match = path.match(/^\/casos\/([^\/]+)\/?$/);

  if (!match) {
    // Não é um link de caso — 404 normal.
    conteudo.className = 'aa-fallback';
    conteudo.innerHTML = 'Página não encontrada. <a href="/">Voltar para a home</a>';
  } else {
    const slug = decodeURIComponent(match[1]);
    fetch(`${AA_ENDPOINT}?slug=${encodeURIComponent(slug)}`)
      .then(r => r.json())
      .then(data => {
        const caso = (data.ok && data.casos && data.casos[0]) || null;
        if (!caso) {
          conteudo.className = 'aa-fallback';
          conteudo.innerHTML = 'Esse relato não foi encontrado, ou ainda não foi publicado. <a href="/">Ver todos os relatos</a>';
          return;
        }

        const respondido = caso.respostaOficial && caso.respostaOficial.trim() !== '';
        const linkCaso = `${AA_SITE_BASE}/casos/${encodeURIComponent(caso.slug)}`;
        const shareTxt = encodeURIComponent(`Fala Sem Medo — Marataízes (${caso.categoria}):\n\n"${caso.texto.slice(0,180)}${caso.texto.length>180?'…':''}"\n\nVeja: ${linkCaso}`);

        document.title = `${caso.titulo} — Fala Sem Medo | TV Marataízes`;

        conteudo.className = '';
        conteudo.innerHTML = `
          <div class="aa-card">
            <div class="aa-card-head">
              <div class="aa-card-meta">
                <span class="aa-card-cat">${esc(caso.categoria)}</span>
                ${caso.bairro ? `<span class="aa-card-bairro">📍 ${esc(caso.bairro)}</span>` : ''}
              </div>
              <span class="aa-card-data">${fmtData(caso.dataHora)}</span>
            </div>
            <h1 class="aa-card-titulo">${esc(caso.titulo)}</h1>
            <span class="aa-card-autor">Relato de ${esc(caso.nomeFicticio)}</span>
            <span class="aa-badge ${respondido?'done':'wait'}">${respondido?'✓ Respondido oficialmente':'⏳ Aguardando resposta oficial'}</span>
            <p class="aa-card-texto">${esc(caso.texto)}</p>
            ${caso.fotoURL ? `<img src="${esc(caso.fotoURL)}" alt="Foto enviada com o relato" class="aa-card-foto">` : ''}
            ${caso.videoEmbedURL ? `<div class="aa-card-video"><iframe src="${esc(caso.videoEmbedURL)}" allowfullscreen frameborder="0"></iframe></div>` : ''}
            ${respondido ? `<div class="aa-resposta"><div class="lbl">Resposta oficial · ${fmtData(caso.dataResposta)}</div>${esc(caso.respostaOficial)}${caso.fotoRespostaURL?`<img src="${esc(caso.fotoRespostaURL)}" alt="Foto da resposta oficial" class="aa-card-foto" style="margin-top:10px;">`:''}</div>` : `
              <div class="aa-resposta-convite">
                <span class="aa-resposta-convite-txt">📢 Foi citado nesse relato? Responda oficialmente aqui.</span>
                <div class="aa-btn" id="aa-abrir-resposta">Responder</div>
              </div>
              <div class="aa-resposta-form" id="aa-resposta-form">
                <input type="text" id="aa-resp-nome" placeholder="Seu nome (opcional)">
                <input type="text" id="aa-resp-cargo" placeholder="Cargo/órgão (ex: Secretaria de Obras)">
                <textarea id="aa-resp-texto" placeholder="Escreva a resposta oficial a esse relato..."></textarea>
                <label class="aa-resp-foto-label" style="display:block;font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">Foto (opcional)</label>
                <input type="file" id="aa-resp-foto" accept="image/*" style="width:100%;background:#0e0b0a;border:1px solid #2a2020;color:#fff;border-radius:6px;padding:8px 10px;font-size:12px;margin-bottom:10px;box-sizing:border-box;">
                <button class="aa-resp-enviar" id="aa-resp-enviar">Publicar resposta</button>
              </div>
            `}
            <div class="aa-actions">
              <a class="aa-btn primary" href="https://wa.me/?text=${shareTxt}" target="_blank" rel="noopener">📲 Compartilhar no WhatsApp</a>
              <a class="aa-btn" href="/#aa-section">Ver todos os relatos</a>
            </div>
          </div>
        `;

        if (!respondido) {
          document.getElementById('aa-abrir-resposta').addEventListener('click', () => {
            const form = document.getElementById('aa-resposta-form');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
          });
          document.getElementById('aa-resp-enviar').addEventListener('click', async (e) => {
            const respostaTxt = document.getElementById('aa-resp-texto').value.trim();
            if (!respostaTxt) { document.getElementById('aa-resp-texto').focus(); return; }
            const btn = e.target;
            btn.disabled = true; btn.textContent = 'Enviando...';
            const fotoInput = document.getElementById('aa-resp-foto');
            const fotoBase64 = fotoInput && fotoInput.files[0] ? await AA_prepararFoto(fotoInput.files[0], 1000, 0.75) : null;
            try {
              const r = await fetch(AA_ENDPOINT, {
                method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                  acao: 'responder', slug: caso.slug, resposta: respostaTxt,
                  nomeRespondente: document.getElementById('aa-resp-nome').value.trim(),
                  cargoRespondente: document.getElementById('aa-resp-cargo').value.trim(),
                  foto: fotoBase64
                })
              });
              const resultado = await r.json();
              if (resultado.ok) {
                window.location.reload();
              } else {
                alert('Não foi possível publicar a resposta agora.');
                btn.disabled = false; btn.textContent = 'Publicar resposta';
              }
            } catch (err) {
              alert('Falha de conexão ao enviar a resposta.');
              btn.disabled = false; btn.textContent = 'Publicar resposta';
            }
          });
        }
      })
      .catch(() => {
        conteudo.className = 'aa-fallback';
        conteudo.innerHTML = 'Não foi possível carregar esse relato agora. <a href="/">Voltar para a home</a>';
      });
  }

  } // fecha o else do bloco /falasemmedo
</script>
</body>
</html>
